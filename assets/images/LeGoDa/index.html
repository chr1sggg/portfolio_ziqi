<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .gallery {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            display: none;
        }

        .gallery img.active {
            display: block;
        }

        button {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
        }

        #prev {
            left: 20px;
        }

        #next {
            right: 20px;
        }
    </style>
</head>

<body>

    <div class="gallery">
        <img src="pic1.png" alt="Project image 1" class="active">
        <img src="pic2.png" alt="Project image 2">
        <img src="pic3.png" alt="Project image 3">
    </div>

    <button id="prev">←</button>
    <button id="next">→</button>

    <script>
        const images = document.querySelectorAll(".gallery img");
        let current = 0;

        function showImage(index) {
            images[current].classList.remove("active");

            current = (index + images.length) % images.length;

            images[current].classList.add("active");
        }

        document.getElementById("next").addEventListener("click", () => {
            showImage(current + 1);
        });

        document.getElementById("prev").addEventListener("click", () => {
            showImage(current - 1);
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight") {
                showImage(current + 1);
            }

            if (event.key === "ArrowLeft") {
                showImage(current - 1);
            }
        });
    </script>

</body>
</html>
